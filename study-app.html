<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study App | BSCS 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}
header {
    background: #1a73e8;
    color: white;
    padding: 15px;
    text-align: center;
}
nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: white;
    display: flex;
    border-top: 1px solid #ccc;
}
nav button {
    flex: 1;
    padding: 10px;
    border: none;
    background: none;
    font-size: 14px;
}
section {
    display: none;
    padding: 15px;
}
section.active {
    display: block;
}
.card {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}
.calendar div {
    background: #e8f0fe;
    padding: 10px;
    text-align: center;
    border-radius: 6px;
}
.class-day {
    background: #1a73e8;
    color: white;
}
textarea {
    width: 100%;
    height: 150px;
    border-radius: 8px;
    border: 1px solid #ccc;
    padding: 10px;
}
a.button {
    display: inline-block;
    background: #1a73e8;
    color: white;
    padding: 10px;
    border-radius: 8px;
    text-decoration: none;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>
<h2>📚 Study App – BSCS 2</h2>
</header>

<!-- DASHBOARD -->
<section id="home" class="active">
<div class="card">
<h3>📅 Today's Focus</h3>
<p><strong>Rizal's Life & Works</strong></p>
<p>1:30 PM – 4:00 PM</p>
</div>
</section>

<!-- MONTHLY CALENDAR -->
<section id="calendar">
<div class="card">
<h3>📆 January 2026</h3>
<div class="calendar">
<div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
<div></div>
<div class="class-day">5</div>
<div>6</div>
<div class="class-day">7</div>
<div>8</div>
<div class="class-day">9</div>
<div></div>
</div>
<p>🔵 = Class Day</p>
</div>
</section>

<!-- NOTES -->
<section id="notes">
<div class="card">
<h3>📝 Study Notes</h3>
<textarea id="notesArea" placeholder="Write your notes here..."></textarea>
</div>
</section>

<!-- SETTINGS -->
<section id="settings">
<div class="card">
<h3>☁ Google Calendar Sync</h3>
<a class="button" target="_blank"
href="https://www.google.com/calendar/render?action=TEMPLATE&text=Rizal's+Life+and+Works&dates=20260105T053000Z/20260105T080000Z&details=GE09+Class">
Add Rizal Class
</a>
</div>
</section>

<!-- NAV -->
<nav>
<button onclick="show('home')">🏠 Home</button>
<button onclick="show('calendar')">📆 Calendar</button>
<button onclick="show('notes')">📝 Notes</button>
<button onclick="show('settings')">⚙ Settings</button>
</nav>

<audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"></audio>

<script>
// Navigation
function show(id) {
    document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

// Notes save
const notes = document.getElementById("notesArea");
notes.value = localStorage.getItem("notes") || "";
notes.addEventListener("input", () => {
    localStorage.setItem("notes", notes.value);
});

// Notifications + Sound Alarm
if (Notification.permission !== "granted") {
    Notification.requestPermission();
}

const alarmTime = new Date("January 5, 2026 13:15:00");
const now = new Date();
const delay = alarmTime - now;

if (delay > 0) {
    setTimeout(() => {
        document.getElementById("alarmSound").play();
        new Notification("📚 Class Reminder", {
            body: "Rizal's Life & Works starts in 15 minutes!"
        });
    }, delay);
}
</script>

</body>
</html>
